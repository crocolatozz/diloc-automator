<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>DILOC Automator</title>
  <script src="theme-init.js"></script>
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-hover: #f1f5f9;
      --bg-pill-track: rgba(241, 245, 249, 0.85);
      --bg-pill-active: rgba(16, 185, 129, 0.14);
      --border-pill-active: rgba(16, 185, 129, 0.55);
      --text-pill-active: #047857;
      --bg-opt-inactive: rgba(255, 255, 255, 0.72);
      --border-opt-inactive: rgba(148, 163, 184, 0.35);
      --bg-upload-hover: #f0fdf4;
      --border-color: #cbd5e1;
      --border-soft: #e2e8f0;
      --border-upload: #94a3b8;
      --text-title: #0f172a;
      --text-body: #1e293b;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-footer: #94a3b8;
      --text-status-ok: #15803d;
      --text-status-err: #dc2626;
      --link-color: #0284c7;
      --warn-pill-bg: rgba(239, 68, 68, 0.12);
      --warn-pill-text: #dc2626;
      --warn-pill-border: rgba(239, 68, 68, 0.45);
      --alert-warn-bg: #fffbeb;
      --alert-warn-border: #f59e0b;
      --alert-warn-text: #92400e;
      --alert-err-bg: #fef2f2;
      --alert-err-border: #ef4444;
      --alert-err-text: #991b1b;
      --rand-badge-bg: rgba(16, 185, 129, 0.14);
      --rand-badge-border: rgba(16, 185, 129, 0.55);
      --rand-badge-text: #047857;
      --text-status-warn: #b45309;
      --btn-disabled-bg: #cbd5e1;
      --btn-disabled-text: #64748b;
      --pill-track-bg: #fef3c7;
      --pill-track-border: #f59e0b;
      --pill-thumb-bg: #ffffff;
      --pill-thumb-shadow: 0 1px 4px rgba(217, 119, 6, 0.35);
      --pill-sun-color: #d97706;
      --pill-moon-color: #94a3b8;
      --focus-ring: #0284c7;
      --focus-ring-offset: #f8fafc;
    }

    :root[data-theme="dark"] {
      --bg-body: #0b1120;
      --bg-card: #111827;
      --bg-hover: rgba(51, 65, 85, 0.55);
      --bg-pill-track: rgba(15, 23, 42, 0.7);
      --bg-pill-active: rgba(16, 185, 129, 0.16);
      --border-pill-active: rgba(52, 211, 153, 0.55);
      --text-pill-active: #34d399;
      --bg-opt-inactive: rgba(30, 41, 59, 0.5);
      --border-opt-inactive: rgba(148, 163, 184, 0.18);
      --bg-upload-hover: rgba(22, 163, 74, 0.14);
      --border-color: #273449;
      --border-soft: #1f2b3e;
      --border-upload: #475569;
      --text-title: #f1f5f9;
      --text-body: #e2e8f0;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-footer: #64748b;
      --text-status-ok: #4ade80;
      --text-status-err: #f87171;
      --link-color: #38bdf8;
      --warn-pill-bg: rgba(239, 68, 68, 0.16);
      --warn-pill-text: #fca5a5;
      --warn-pill-border: rgba(248, 113, 113, 0.55);
      --alert-warn-bg: rgba(217, 119, 6, 0.18);
      --alert-warn-border: #d97706;
      --alert-warn-text: #fde68a;
      --alert-err-bg: rgba(220, 38, 38, 0.2);
      --alert-err-border: #ef4444;
      --alert-err-text: #fecaca;
      --rand-badge-bg: rgba(16, 185, 129, 0.16);
      --rand-badge-border: rgba(52, 211, 153, 0.55);
      --rand-badge-text: #34d399;
      --text-status-warn: #fbbf24;
      --btn-disabled-bg: #1e293b;
      --btn-disabled-text: #64748b;
      --pill-track-bg: #1e1b4b;
      --pill-track-border: #6366f1;
      --pill-thumb-bg: #4f46e5;
      --pill-thumb-shadow: 0 1px 6px rgba(99, 102, 241, 0.55);
      --pill-sun-color: #64748b;
      --pill-moon-color: #e0e7ff;
      --focus-ring: #38bdf8;
      --focus-ring-offset: #0b1120;
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 340px;
      height: auto;
      min-height: unset;
    }

    body {
      width: 340px;
      min-width: 340px;
      max-width: 340px;
      height: auto;
      min-height: unset;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 13px 15px;
      text-align: center;
      margin: 0 auto;
      background: var(--bg-body);
      color: var(--text-body);
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    @media (max-width: 339px) {
      html, body {
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }
      body {
        padding: 10px 12px;
      }
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    label:focus-visible,
    [role="button"]:focus-visible {
      outline: 2.5px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-soft);
      transition: border-color 0.25s ease;
    }

    .popup-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .popup-header h4 {
      margin: 0;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13.5px;
      color: var(--text-title);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: left;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.25s ease;
    }

    @media (max-width: 339px) {
      .popup-header h4 {
        font-size: 12.5px;
        flex-shrink: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    .popup-ver-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: var(--text-pill-active);
      flex-shrink: 0;
      letter-spacing: 0.01em;
    }

    /* Interactive Sliding Pill Toggle */
    .theme-pill-switch {
      position: relative;
      width: 52px;
      height: 26px;
      padding: 0 5px;
      border-radius: 999px;
      border: 1px solid var(--pill-track-border);
      background: var(--pill-track-bg);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.12s ease;
    }

    .theme-pill-switch:hover {
      filter: brightness(1.04);
    }

    .theme-pill-switch:active {
      transform: scale(0.96);
    }

    .theme-pill-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--pill-thumb-bg);
      box-shadow: var(--pill-thumb-shadow);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease, width 0.14s ease;
      z-index: 1;
    }

    .theme-pill-switch:active .theme-pill-thumb {
      width: 22px;
    }

    :root[data-theme="dark"] .theme-pill-thumb {
      transform: translateX(26px);
    }

    :root[data-theme="dark"] .theme-pill-switch:active .theme-pill-thumb {
      transform: translateX(24px);
    }

    .theme-pill-icon {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s ease, opacity 0.25s ease, transform 0.25s ease;
    }

    .theme-pill-sun {
      color: var(--pill-sun-color);
      opacity: 1;
      transform: scale(1);
    }

    .theme-pill-moon {
      color: var(--pill-moon-color);
      opacity: 0.65;
      transform: scale(0.88);
    }

    :root[data-theme="dark"] .theme-pill-sun {
      opacity: 0.55;
      transform: scale(0.88);
    }

    :root[data-theme="dark"] .theme-pill-moon {
      opacity: 1;
      transform: scale(1);
    }

    .svg-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      vertical-align: middle;
    }

    .icon-emerald { color: #16a34a; }
    .icon-sky { color: var(--link-color); }
    .icon-cyan { color: #0891b2; }
    .icon-indigo { color: #4f46e5; }
    .icon-amber { color: #d97706; }
    .icon-orange { color: #fb923c; }
    .icon-rose { color: #e11d48; }
    .icon-slate { color: var(--text-muted); }

    :root[data-theme="dark"] .icon-emerald { color: #34d399; }
    :root[data-theme="dark"] .icon-cyan { color: #22d3ee; }
    :root[data-theme="dark"] .icon-indigo { color: #818cf8; }
    :root[data-theme="dark"] .icon-amber { color: #fbbf24; }
    :root[data-theme="dark"] .icon-orange { color: #fb923c; }
    :root[data-theme="dark"] .icon-rose { color: #fb7185; }

    /* Custom CSS Floating Tooltip System */
    .tooltip-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tooltip-wrap.tooltip-block {
      display: block;
      width: 100%;
    }

    .custom-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 7px);
      transform: translateX(-50%) translateY(3px);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 240px;
      width: max-content;
      padding: 5px 8px;
      border-radius: 7px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.38);
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      white-space: normal;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      z-index: 60;
      transition: opacity 0.14s ease 0ms, transform 0.14s ease 0ms, visibility 0s linear 0.14s;
    }

    :root[data-theme="dark"] .custom-tooltip {
      background: #1e293b;
      color: #f8fafc;
      border-color: rgba(148, 163, 184, 0.42);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
    }

    .custom-tooltip .tooltip-info-icon {
      color: #38bdf8;
      flex-shrink: 0;
    }

    .tooltip-wrap[data-tooltip-pos="bottom"] > .custom-tooltip {
      bottom: auto;
      top: calc(100% + 7px);
      transform: translateX(-50%) translateY(-3px);
    }

    .tooltip-wrap[data-tooltip-align="left"] > .custom-tooltip {
      left: 0;
      transform: translateX(0) translateY(3px);
    }

    .tooltip-wrap[data-tooltip-pos="bottom"][data-tooltip-align="left"] > .custom-tooltip {
      transform: translateX(0) translateY(-3px);
    }

    .tooltip-wrap[data-tooltip-align="right"] > .custom-tooltip {
      left: auto;
      right: 0;
      transform: translateX(0) translateY(3px);
    }

    .tooltip-wrap[data-tooltip-pos="bottom"][data-tooltip-align="right"] > .custom-tooltip {
      transform: translateX(0) translateY(-3px);
    }

    .tooltip-wrap:hover > .custom-tooltip,
    .tooltip-wrap:focus-within > .custom-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      transition: opacity 0.16s ease 250ms, transform 0.16s ease 250ms, visibility 0s linear 250ms;
    }

    .tooltip-wrap[data-tooltip-align="left"]:hover > .custom-tooltip,
    .tooltip-wrap[data-tooltip-align="left"]:focus-within > .custom-tooltip,
    .tooltip-wrap[data-tooltip-align="right"]:hover > .custom-tooltip,
    .tooltip-wrap[data-tooltip-align="right"]:focus-within > .custom-tooltip {
      transform: translateX(0) translateY(0);
    }

    .custom-file-upload {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 12px;
      cursor: pointer;
      background: var(--bg-card);
      border: 1.5px dashed var(--border-upload);
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-secondary);
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .custom-file-upload:hover,
    .custom-file-upload.is-dragover {
      border-color: #16a34a;
      background: var(--bg-upload-hover);
    }

    .custom-file-upload.disabled {
      opacity: 0.55;
      pointer-events: none;
    }

    input[type="file"] {
      display: none;
    }

    .status-card {
      position: relative;
      width: 100%;
      min-width: 0;
      margin: 8px 0 9px 0;
      padding: 7px 28px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .status-card[hidden] {
      display: none;
    }

    .clear-file-wrap {
      position: absolute;
      top: 5px;
      right: 5px;
    }

    .clear-file-wrap[hidden] {
      display: none;
    }

    .clear-file-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.28);
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.1s ease;
    }

    .clear-file-btn:hover:not(:disabled) {
      background: #dc2626;
      border-color: #ef4444;
      color: #ffffff;
    }

    .clear-file-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .clear-file-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .status-line-text {
      flex: 0 1 auto;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .status-line-file {
      color: var(--text-title);
    }

    .status-line-op.is-match {
      color: var(--text-status-ok);
    }

    .status-line-op.is-mismatch {
      color: var(--text-status-warn);
    }

    .ctrl-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      text-align: left;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .ctrl-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: color 0.25s ease;
    }

    .ctrl-title-left {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .range-pill-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px;
      border-radius: 99px;
      background: var(--bg-pill-track);
      border: 1px solid var(--border-soft);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .range-option {
      border: 1px solid transparent;
      border-radius: 99px;
      padding: 1px 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.35;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .range-option:hover:not(.active) {
      background: var(--bg-hover);
      color: var(--text-title);
    }

    .range-option.active {
      background: var(--rand-badge-bg);
      border-color: var(--rand-badge-border);
      color: var(--rand-badge-text);
    }

    .segmented-pill {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 3px;
      border-radius: 7px;
      background: var(--bg-pill-track);
      border: 1px solid var(--border-soft);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .seg-option {
      border: 1px solid var(--border-opt-inactive);
      border-radius: 5px;
      padding: 5px 3px;
      background: var(--bg-opt-inactive);
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .seg-option:hover:not(.active) {
      background: var(--bg-hover);
      color: var(--text-title);
    }

    .seg-option.active {
      background: var(--bg-pill-active);
      border-color: var(--border-pill-active);
      color: var(--text-pill-active);
    }

    .stepper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 9px;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .stepper-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.25s ease;
    }

    .stepper-control {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .stepper-btn {
      width: 26px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--border-opt-inactive);
      border-radius: 6px;
      background: var(--bg-opt-inactive);
      color: var(--text-title);
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
    }

    .stepper-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--border-upload);
    }

    .stepper-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .stepper-input {
      width: 34px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-body);
      color: var(--text-title);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
      appearance: textfield;
      -moz-appearance: textfield;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .stepper-input::-webkit-outer-spin-button,
    .stepper-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .inline-alert {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      text-align: left;
      padding: 8px 10px;
      margin-bottom: 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      background: var(--alert-warn-bg);
      border: 1px solid var(--alert-warn-border);
      color: var(--alert-warn-text);
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .inline-alert.is-error {
      background: var(--alert-err-bg);
      border-color: var(--alert-err-border);
      color: var(--alert-err-text);
    }

    .inline-alert[hidden] {
      display: none;
    }

    .inline-alert .svg-icon {
      margin-top: 1px;
    }

    #toggleBtn {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: #ffffff;
      background: #16a34a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    #toggleBtn:disabled {
      background: var(--btn-disabled-bg);
      color: var(--btn-disabled-text);
      cursor: not-allowed;
    }

    #toggleBtn.running {
      background: #dc2626;
      animation: pulseRun 1.2s infinite;
    }

    #toggleBtn:hover:not(:disabled) {
      filter: brightness(0.95);
    }

    @keyframes pulseRun {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.82; }
    }

    .btn-setting {
      width: 100%;
      margin-top: 7px;
      padding: 8px 10px;
      background: var(--bg-opt-inactive);
      border: 1px solid var(--border-opt-inactive);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-title);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .btn-setting:hover {
      background: var(--bg-hover);
      border-color: var(--border-upload);
    }

    .footer-credit {
      margin-top: 9px;
      padding-top: 7px;
      border-top: 1px solid var(--border-soft);
      font-size: 10px;
      color: var(--text-footer);
      letter-spacing: 0.2px;
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    /* Custom In-DOM Confirm Modal */
    .confirm-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
      z-index: 120;
    }

    .confirm-modal-backdrop[hidden] {
      display: none;
    }

    .confirm-modal-card {
      margin: auto;
      width: 100%;
      max-width: 300px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      background: #0f172a;
      color: #f1f5f9;
      border: 1px solid rgba(245, 158, 11, 0.48);
      border-radius: 12px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.6);
      padding: 15px 15px 14px;
      text-align: center;
    }

    .confirm-modal-icon {
      width: 34px;
      height: 34px;
      margin: 0 auto 8px;
      border-radius: 9px;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fbbf24;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .confirm-modal-title {
      margin: 0 0 6px;
      font-size: 13.5px;
      font-weight: 700;
      color: #f8fafc;
    }

    .confirm-modal-desc {
      margin: 0;
      font-size: 11px;
      line-height: 1.45;
      color: #cbd5e1;
      word-break: break-word;
    }

    .confirm-modal-file {
      display: block;
      margin-top: 4px;
      font-weight: 700;
      color: #fde68a;
    }

    .confirm-modal-actions {
      margin-top: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .confirm-modal-btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .confirm-btn-cancel {
      background: rgba(148, 163, 184, 0.16);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .confirm-btn-cancel:hover {
      background: rgba(148, 163, 184, 0.28);
    }

    .confirm-btn-danger {
      background: #dc2626;
      color: #ffffff;
      border: 1px solid #ef4444;
    }

    .confirm-btn-danger:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>
  <header class="popup-header">
    <div class="popup-brand">
      <span data-icon="robotRed" data-icon-size="22"></span>
      <h4>DILOC Automator</h4>
      <span class="popup-ver-badge">v2.2.2</span>
    </div>
    <button
      id="themeToggleBtn"
      type="button"
      class="theme-pill-switch"
      role="switch"
      aria-checked="false"
      aria-label="Light Mode aktif — Klik untuk Dark Mode"
      title="Light Mode aktif — Klik untuk Dark Mode"
    >
      <span class="theme-pill-thumb" aria-hidden="true"></span>
      <span data-icon="sun" data-icon-class="theme-pill-icon theme-pill-sun" data-icon-size="13"></span>
      <span data-icon="moon" data-icon-class="theme-pill-icon theme-pill-moon" data-icon-size="13"></span>
    </button>
  </header>

  <div id="fileLabel" class="custom-file-upload" role="button" tabindex="0" aria-label="Load File .PMR atau .JSON (Klik atau Drag &amp; Drop)">
    <span data-icon="folder" data-icon-class="icon-emerald" data-icon-size="16"></span>
    <span>Load File .PMR / .JSON</span>
  </div>

  <div id="statusCard" class="status-card" hidden>
    <div id="clearFileBtnWrap" class="tooltip-wrap clear-file-wrap" data-tooltip="Hapus file termuat" data-tooltip-pos="bottom" data-tooltip-align="right" hidden>
      <button id="clearFileBtn" type="button" class="clear-file-btn" aria-label="Hapus file termuat">
        <span data-icon="x" data-icon-size="13"></span>
      </button>
    </div>
    <div id="statusLineFile" class="status-line status-line-file"></div>
    <div id="statusLineOp" class="status-line status-line-op"></div>
  </div>

  <div class="ctrl-card">
    <div class="ctrl-header">
      <span class="ctrl-title-left">
        <span data-icon="dice" data-icon-class="icon-orange" data-icon-size="14"></span>
        <span>Randomize</span>
      </span>
      <div class="range-pill-group" role="radiogroup" aria-label="Range Randomize">
        <button type="button" class="range-option active" data-rand-range="1" role="radio" aria-checked="true">±1</button>
        <button type="button" class="range-option" data-rand-range="2" role="radio" aria-checked="false">±2</button>
        <button type="button" class="range-option" data-rand-range="3" role="radio" aria-checked="false">±3</button>
      </div>
    </div>
    <div class="segmented-pill" role="radiogroup" aria-label="Mode Randomize">
      <button type="button" class="seg-option active" data-rand-mode="off" role="radio" aria-checked="true">Off</button>
      <button type="button" class="seg-option" data-rand-mode="all" role="radio" aria-checked="false">All</button>
      <button type="button" id="selectedModeBtn" class="seg-option" data-rand-mode="selected" role="radio" aria-checked="false">Selected (0)</button>
    </div>
  </div>

  <div class="stepper-row">
    <label for="rowCountInput" class="stepper-label">
      <span data-icon="layers" data-icon-class="icon-indigo" data-icon-size="14"></span>
      <span>Jumlah Baris</span>
    </label>
    <div class="stepper-control">
      <button type="button" id="rowDecBtn" class="stepper-btn" aria-label="Kurangi jumlah baris">-</button>
      <input type="number" id="rowCountInput" class="stepper-input" min="1" max="4" value="1" aria-label="Jumlah Baris">
      <button type="button" id="rowIncBtn" class="stepper-btn" aria-label="Tambah jumlah baris">+</button>
    </div>
  </div>

  <div id="popupAlert" class="inline-alert" role="alert" hidden></div>

  <div id="playBtnWrap" class="tooltip-wrap tooltip-block" data-tooltip="Muat file .pmr / .json terlebih dahulu" data-tooltip-pos="top" data-tooltip-align="center">
    <button id="toggleBtn" disabled>
      <span data-icon="play" data-icon-size="15"></span>
      <span>Play</span>
    </button>
  </div>

  <button id="openSettingsBtn" class="btn-setting">
    <span data-icon="settings" data-icon-class="icon-sky" data-icon-size="14"></span>
    <span>Setting Sel &amp; Preset Operator</span>
  </button>

  <div class="footer-credit">© 2026 — Developed by FIKRI</div>

  <div id="clearConfirmModal" class="confirm-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="clearConfirmTitle" hidden>
    <div class="confirm-modal-card">
      <div class="confirm-modal-icon">
        <span data-icon="warn" data-icon-size="18"></span>
      </div>
      <h5 id="clearConfirmTitle" class="confirm-modal-title">Hapus File Termuat?</h5>
      <p class="confirm-modal-desc">
        File aktif berikut akan dilepas, namun preset centang Op. Lap tetap aman:
        <span id="clearConfirmFileName" class="confirm-modal-file"></span>
      </p>
      <div class="confirm-modal-actions">
        <button id="confirmClearCancelBtn" type="button" class="confirm-modal-btn confirm-btn-cancel">Batal</button>
        <button id="confirmClearOkBtn" type="button" class="confirm-modal-btn confirm-btn-danger">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firestore-sync.js"></script>
  <script src="parser.js"></script>
  <script src="randomizer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
